name: S3 Static Website CI/CD Pipeline

# 1. 트리거: main 브랜치에 푸시될 때 실행
on:
  push:
    branches:
      - main

jobs:
  deploy-to-s3:
    runs-on: ubuntu-latest

    steps:
      # Step 1: GitHub 저장소 소스코드 체크아웃
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      # Step 2: AWS IAM 자격 증명 구성
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # Step 3: html 디렉터리 내용을 S3 버킷으로 동기화
      - name: S3 버킷 파일 동기화
        run: |
          aws s3 sync ./html s3://${{ secrets.S3_BUCKET_NAME }} --delete --acl public-read